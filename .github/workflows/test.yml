name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Must be the exact pnpm that wrote pnpm-lock.yaml. Two prior failures, one
          # root cause -- the verifier was not the writer:
          #   - pnpm 9 refused the lockfile outright (ERR_PNPM_OUTDATED_LOCKFILE):
          #     the two majors disagree about how a peer-only dependency is recorded
          #     in the root importer.
          #   - `version: 11` floats, so CI ran 11.28.x while the lockfile had been
          #     written and locally verified under 11.5.0 -- and 11.28's frozen check
          #     requires the root importer to carry the `@deepseek-ai/dsh` peer entry,
          #     which the older lockfile lacked (the lockfile was regenerated with
          #     11.28.3 so both versions accept it now).
          # Pinned exactly, so a future pnpm release cannot fail a commit that passes
          # locally. Bump this in the same commit as any lockfile change.
          version: 11.28.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
