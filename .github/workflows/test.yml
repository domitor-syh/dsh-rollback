name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Must match the pnpm that writes pnpm-lock.yaml. Pinned to 9 the lockfile
          # was refused outright (`ERR_PNPM_OUTDATED_LOCKFILE`: the root importer had
          # lost the `@deepseek-ai/dsh` peer entry, and the two majors disagree about
          # how peer dependencies are recorded at the root), so CI failed on a commit
          # whose tests all passed locally. Same major as the project's own toolchain
          # keeps the writer and the verifier from drifting apart again.
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
